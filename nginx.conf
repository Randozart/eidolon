server {
    # Listen on 8080 (Non-root compatible)
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # --- Security Headers ---
    
    # Hide Nginx Version
    server_tokens off;

    # Prevent clickjacking (site cannot be embedded in iframes)
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Prevent MIME-sniffing attacks
    add_header X-Content-Type-Options "nosniff" always;

    # Enable XSS protection filter in older browsers
    add_header X-XSS-Protection "1; mode=block" always;

    # Control how much referrer information is sent
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Content Security Policy (CSP)
    # This is a strict policy that allows:
    # 1. Scripts from self
    # 2. WASM execution (required for your game engine)
    # 3. Inline styles (common in React/Vite apps)
    # 4. Connections to Google Generative AI (if client-side) or your backend
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://generativelanguage.googleapis.com; worker-src 'self' blob:;" always;

    # --- Optimization ---
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # --- Routing & Application Logic ---

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static Asset Caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # WASM Support
    location ~* \.wasm$ {
        types {
            application/wasm wasm;
        }
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # Z-Machine Files
    location ~* \.z[0-9]+$ {
        add_header Content-Type application/octet-stream;
    }
}
# --- Global Context ---
worker_processes auto;
# Move PID to /tmp for read-only filesystem compatibility
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # Include standard MIME types
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Set temporary paths to /tmp (our writable tmpfs mount)
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp_path;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Optimization
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Security Headers
    server_tokens off;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://generativelanguage.googleapis.com; worker-src 'self' blob:;" always;

    server {
        listen 8080;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # SPA Routing
        location / {
            try_files $uri $uri/ /index.html;
        }

        # WASM MIME type
        location ~* \.wasm$ {
            types { application/wasm wasm; }
            add_header Cache-Control "public, no-transform";
        }

        # Z-Machine Files
        location ~* \.z[0-9]+$ {
            add_header Content-Type application/octet-stream;
        }

        # Static Asset Caching
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
            expires 1y;
            add_header Cache-Control "public, no-transform";
        }

        # Log to /tmp or disable to keep it stateless
        access_log /tmp/access.log;
        error_log /tmp/error.log;
    }
}